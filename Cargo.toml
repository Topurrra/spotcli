[package]
name = "spotcli"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Spotify in your terminal: a keyboard-driven TUI client for the Spotify Web API"
repository = "https://github.com/Topurrra/spotcli"
keywords = ["spotify", "tui", "terminal", "music", "ratatui"]
categories = ["command-line-utilities", "multimedia::audio"]

[lib]
name = "spotcli"
path = "src/lib.rs"

[[bin]]
name = "spotcli"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29"
dirs = "6"
open = "5"
rand = "0.9"
ratatui = "0.30"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
