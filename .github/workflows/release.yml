name: Release

# Pushing a tag like v1.0.0 builds spotcli for every platform and attaches
# the archives to the GitHub release of that tag (created if missing).
on:
  push:
    tags: ["v*"]
  # Rebuild an existing tag by hand: gh workflow run release.yml -f tag=v1.0.0
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build and upload
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc, label: x86_64-windows }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, label: x86_64-linux }
          - { os: macos-latest, target: aarch64-apple-darwin, label: aarch64-macos }
          - { os: macos-latest, target: x86_64-apple-darwin, label: x86_64-macos }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install ALSA headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "spotcli-${{ env.TAG }}-${{ matrix.label }}"
          New-Item -ItemType Directory $name | Out-Null
          Copy-Item target/${{ matrix.target }}/release/spotcli.exe, packaging/windows/install.ps1, README.md, LICENSE $name
          Compress-Archive -Path $name -DestinationPath "$name.zip"
          "ASSET=$name.zip" | Out-File -Append $env:GITHUB_ENV
      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          name="spotcli-${{ env.TAG }}-${{ matrix.label }}"
          mkdir "$name"
          cp target/${{ matrix.target }}/release/spotcli README.md LICENSE "$name"
          tar czf "$name.tar.gz" "$name"
          echo "ASSET=$name.tar.gz" >> "$GITHUB_ENV"

      - name: Upload to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --title "spotcli $TAG" --generate-notes \
            || true
          gh release upload "$TAG" "$ASSET" --clobber
